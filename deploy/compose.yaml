# Production stack on the server (/srv/trilleo). This file ships inside the web image and
# trilleo-deploy copies it out on every deploy, so it always matches the running release.
#   .env     written by trilleo-deploy: REGISTRY, WEB_IMAGE, APP_IMAGE
#   db.env   created once by hand (deploy/README.md): the database password
#   app.env  created once by hand: GitHub sign-in (OAuth App, admin IDs), and
#            optionally search engine verification and IndexNow (deploy/README.md §9),
#            and file storage on OBS (deploy/storage.md)
name: trilleo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Caddy: TLS, the static site, and a reverse proxy to `app` for everything else.
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be set (see /srv/trilleo/.env)}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Cloudflare Origin certificate: origin.pem + origin.key (root-owned).
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  # The Astro server. Only reachable inside this stack; migrates the database on start.
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set (see /srv/trilleo/.env)}
    restart: unless-stopped
    environment:
      # No password here: postgres.js reads PGPASSWORD from db.env.
      DATABASE_URL: postgres://trilleo@db:5432/trilleo
      # Malware scanning of uploads (the clamav service below).
      CLAMAV_ADDRESS: clamav:3310
    env_file:
      - db.env
      - app.env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # Postgres. The Deploy workflow copies this exact tag from Docker Hub to SWR when SWR
  # doesn't have it yet (a slow upload), so updating Postgres = changing the tag here.
  db:
    image: ${REGISTRY:?REGISTRY must be set (see /srv/trilleo/.env)}/postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: trilleo
      POSTGRES_DB: trilleo
      # Sorting and case rules built into Postgres, not the C library, so they can't
      # shift with the image's OS (Alpine's musl vs Debian's glibc). Applies at creation.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
    # POSTGRES_PASSWORD
    env_file: db.env
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/.
      - pgdata:/var/lib/postgresql
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Over TCP: during first-time setup Postgres runs socket-only, so this stays
      # "starting" until the real server is up.
      test:
        [
          "CMD",
          "pg_isready",
          "--host=127.0.0.1",
          "--username=trilleo",
          "--dbname=trilleo",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    logging: *logging

  # ClamAV scans uploads (deploy/storage.md). The app streams each new file to clamd
  # over TCP; when clamd isn't answering, uploads wait for review instead. The image is
  # the "_base" one (no signatures inside, so a small upload to SWR); freshclam fetches
  # the signatures into the volume on first start and updates them twice a day.
  clamav:
    image: ${REGISTRY:?REGISTRY must be set (see /srv/trilleo/.env)}/clamav:1.5.4_base
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
      FRESHCLAM_CHECKS: "2"
      # Files up to 1 GiB (our largest upload) are scanned whole; anything over the
      # limits is reported as such, so the app knows it wasn't scanned.
      CLAMD_CONF_StreamMaxLength: 1100M
      CLAMD_CONF_MaxScanSize: 1100M
      CLAMD_CONF_MaxFileSize: 1100M
      CLAMD_CONF_MaxScanTime: "300000"
      CLAMD_CONF_AlertExceedsMax: "yes"
      # Reloading signatures beside the old ones doubles memory; pause scans instead.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav-db:/var/lib/clamav
    # The image's own check needs minutes on first start (downloading signatures), and
    # deploys wait for every check; the app copes with clamd being unavailable.
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  pgdata:
  clamav-db:
