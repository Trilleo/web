# Production stack on the server (/srv/trilleo). This file ships inside the image and
# trilleo-deploy copies it out on every deploy, so it always matches the running release.
# IMAGE comes from /srv/trilleo/.env, which trilleo-deploy writes.
name: trilleo

services:
  web:
    image: ${IMAGE:?IMAGE must be set (see /srv/trilleo/.env)}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Cloudflare Origin certificate: origin.pem + origin.key (root-owned).
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
