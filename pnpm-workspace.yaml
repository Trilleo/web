packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts. Everything else is blocked.
allowBuilds:
  esbuild: true
  # The root `prepare` script installs the git hook instead.
  simple-git-hooks: false

# Skip versions published less than 24 hours ago (supply-chain safety).
minimumReleaseAge: 1440

overrides:
  # eslint-plugin-jsx-a11y doesn't support ESLint 10; use the maintained fork everywhere
  # (eslint-plugin-astro pulls the original in as an optional peer).
  eslint-plugin-jsx-a11y: npm:eslint-plugin-jsx-a11y-x@^0.2.0
  # Security floors for transitive dependencies (Dependabot alerts) until their parents
  # update. Drop an entry once nothing resolves below it.
  "esbuild@<0.25.0": ^0.25.12 # drizzle-kit's @esbuild-kit (dev only)
  "fflate@>=0.7.0 <0.7.5": ^0.7.5 # satori's opentype.js
  "fast-uri@<3.1.9": ^3.1.9
  "fast-xml-parser@<5.12.0": ^5.12.0
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1 # ESLint (dev only)
  "sharp@<0.35.5": ^0.35.5
  "source-map-js@<1.2.2": ^1.2.2
  "undici@>=8.0.0 <8.12.2": ^8.12.2
  "vite@>=8.3.0 <8.3.3": ^8.3.3
  # Astro's wasm bindings accept emnapi's 2.0 beta as a peer, and pnpm picks it, which
  # breaks `astro check` (its core and runtime halves no longer match). Stay on 1.x.
  "@emnapi/core": ^1.11.3
  "@emnapi/runtime": ^1.11.3
