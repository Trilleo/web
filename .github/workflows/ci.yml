name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Print each task's output as it happens, not once the task finishes.
  TURBO_LOG_ORDER: stream
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Migrations match the schema
        run: |
          pnpm --filter @trilleo/db db:generate
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            echo "::error::The schema changed without a migration. Run: pnpm --filter @trilleo/db db:generate"
            git status --short -- packages/db/migrations
            exit 1
          fi
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # The app image has no node_modules, so the server must run from its bundle alone.
      - name: Server runs without node_modules
        run: pnpm --filter @trilleo/web run check:server

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @trilleo/web exec playwright install --with-deps chromium
      # Build and test are separate steps (not `pnpm test:e2e`) so each has its own
      # logs and time limit; Playwright then only starts `astro preview`.
      - name: Build the e2e site
        run: pnpm --filter @trilleo/web run build:e2e
        timeout-minutes: 5
        env:
          INCLUDE_DRAFTS: "true"
          ASTRO_OUT_DIR: ./dist-e2e
      - name: E2E tests
        run: pnpm --filter @trilleo/web exec playwright test
        timeout-minutes: 12
        env:
          E2E_PREBUILT: "1"
          # Logs each server start and readiness check.
          DEBUG: pw:webserver
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          load: true
          tags: trilleo-app:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          load: true
          tags: trilleo-web:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Lint deploy scripts
        run: shellcheck deploy/*.sh deploy/server/trilleo-deploy deploy/server/trilleo-backup
      # Runs the whole stack (web, app, db) the way the server does.
      - name: Smoke test
        run: bash deploy/smoke-test.sh trilleo-web:ci trilleo-app:ci "${{ github.sha }}"
      - name: Cloudflare IP list is current
        run: bash deploy/check-cloudflare-ips.sh
