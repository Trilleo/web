name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Print each task's output as it happens, not once the task finishes.
  TURBO_LOG_ORDER: stream
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

jobs:
  # The checks run as parallel jobs, so a run takes as long as its slowest job. Each
  # job sets up on its own (about 20 s with the cached pnpm store). New packages, unit
  # tests and e2e specs are picked up by turbo and the shards; only a new kind of check
  # needs a job here. "CI passed" at the end is the one check branch protection needs.
  static:
    name: Format, migrations, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Format check
        run: pnpm format:check
      - name: Migrations match the schema
        run: |
          pnpm --filter @trilleo/db db:generate
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            echo "::error::The schema changed without a migration. Run: pnpm --filter @trilleo/db db:generate"
            git status --short -- packages/db/migrations
            exit 1
          fi
      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  unit-packages:
    name: Unit tests (packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Every workspace package but apps/web, whose tests are sharded below.
      - run: pnpm exec turbo run test --filter='!@trilleo/web'

  unit-web:
    name: Unit tests (web ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # apps/web's tests (most start a PGlite database) are most of the unit-test time.
      - run: pnpm --filter @trilleo/web exec vitest run --shard=${{ matrix.shard }}/4

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The app image has no node_modules, so the server must run from its bundle alone.
      - name: Server runs without node_modules
        run: pnpm --filter @trilleo/web run check:server

  e2e:
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm --filter @trilleo/web exec playwright install --with-deps chromium
      # Build and test are separate steps (not `pnpm test:e2e`) so each has its own
      # logs and time limit; Playwright then only starts `astro preview`. Every shard
      # builds and serves its own site with its own in-memory database, and runs
      # e2e/posts.setup.ts itself.
      - name: Build the e2e site
        run: pnpm --filter @trilleo/web run build:e2e
        timeout-minutes: 5
        env:
          ASTRO_OUT_DIR: ./dist-e2e
          # As in playwright.config.ts: a fake token, so consent-gated analytics loads.
          PUBLIC_CF_ANALYTICS_TOKEN: e2e-analytics-token
          # As in playwright.config.ts: the sample study subject (a draft) is built.
          STUDY_DRAFTS: "1"
      - name: E2E tests
        run: pnpm --filter @trilleo/web exec playwright test --shard=${{ matrix.shard }}/3
        timeout-minutes: 12
        env:
          E2E_PREBUILT: "1"
          # Logs each server start and readiness check.
          DEBUG: pw:webserver
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          load: true
          tags: trilleo-app:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          load: true
          tags: trilleo-web:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Lint deploy scripts
        run: shellcheck deploy/*.sh deploy/server/trilleo-deploy deploy/server/trilleo-backup
      # Runs the whole stack (web, app, db) the way the server does.
      - name: Smoke test
        run: bash deploy/smoke-test.sh trilleo-web:ci trilleo-app:ci "${{ github.sha }}"
      - name: Cloudflare IP list is current
        run: bash deploy/check-cloudflare-ips.sh

  passed:
    name: CI passed
    # Runs even when a job above fails, so it reports a result instead of "skipped".
    if: always()
    needs: [static, lint, unit-packages, unit-web, build, e2e, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Some CI jobs didn't pass."
          exit 1
      - run: echo "All CI jobs passed."
