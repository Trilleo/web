name: Deploy

# Ships main to https://www.trilleo.net after CI passes. Setup: deploy/README.md.
#
# Uploads to Huawei SWR (in mainland China) are slow, about 70 KB/s. A release's own
# layers take seconds, but a new base image (after a version bump) takes 10–30 minutes,
# hence the long time limits and Postgres uploading in parallel with the images.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # Images: $REGISTRY/web, $REGISTRY/app, and $REGISTRY/postgres (a copy).
  REGISTRY: ${{ vars.SWR_REGISTRY }}/${{ vars.SWR_ORG }}

jobs:
  images:
    name: Build and push images
    # After a successful CI run on a push to main (never for pull requests), or by
    # hand; skipped until the Huawei SWR variables exist.
    if: >-
      vars.SWR_REGISTRY != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Huawei SWR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      # Plain image manifests (no attestation index) for the widest registry support.
      - name: Build and push the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.REGISTRY }}/app:${{ env.SHA }}
          build-args: GIT_SHA=${{ env.SHA }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          provenance: false
          sbom: false

      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ env.SHA }}
          build-args: GIT_SHA=${{ env.SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: false
          sbom: false

  postgres:
    name: Copy Postgres and ClamAV to SWR
    # Same condition as `images`.
    if: >-
      vars.SWR_REGISTRY != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Log in to Huawei SWR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      # The server can't pull from Docker Hub, so the exact tags compose.yaml names are
      # copied to SWR once; later deploys find them there and skip this.
      - name: Copy the images compose.yaml uses, unless SWR has them
        run: |
          # <name in SWR> <Docker Hub repository>
          while read -r name source; do
            tag="$(sed -n "s|.*/$name:\([^[:space:]\"]*\).*|\1|p" deploy/compose.yaml)"
            test -n "$tag"
            if docker buildx imagetools inspect "$REGISTRY/$name:$tag" >/dev/null 2>&1; then
              echo "SWR already has $name:$tag."
              continue
            fi
            echo "::notice::Uploading $name:$tag to SWR for the first time; this can take 30 minutes or more."
            docker pull --quiet --platform linux/amd64 "$source:$tag"
            docker tag "$source:$tag" "$REGISTRY/$name:$tag"
            docker push --quiet "$REGISTRY/$name:$tag"
          done <<'IMAGES'
          postgres postgres
          clamav clamav/clamav
          IMAGES

  deploy:
    name: Deploy to www.trilleo.net
    needs: [images, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.trilleo.net
    steps:
      - name: Deploy on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          # An empty secret otherwise surfaces as a vague SSH error.
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is empty; see deploy/README.md §6."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The key's forced command runs trilleo-deploy with this SHA and nothing else.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 "deploy@${DEPLOY_HOST}" "$SHA"

      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            live="$(curl --silent --fail --max-time 15 https://www.trilleo.net/version.txt || true)"
            if [ "$live" = "$SHA" ]; then
              echo "Live: $SHA"
              exit 0
            fi
            echo "Attempt $attempt: version.txt shows '${live}'"
            sleep 10
          done
          echo "::error::https://www.trilleo.net/version.txt doesn't show $SHA"
          exit 1
