name: Deploy

# Ships main to https://www.trilleo.net after CI passes. Setup: deploy/README.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to www.trilleo.net
    # After a successful CI run on a push to main (never for pull requests), or by
    # hand; skipped until the Huawei SWR variables exist.
    if: >-
      vars.SWR_REGISTRY != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://www.trilleo.net
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ${{ vars.SWR_REGISTRY }}/${{ vars.SWR_ORG }}/web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Huawei SWR
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          build-args: GIT_SHA=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A plain image manifest (no attestation index) for the widest registry support.
          provenance: false
          sbom: false

      - name: Deploy on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The key's forced command runs trilleo-deploy with this SHA and nothing else.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 "deploy@${DEPLOY_HOST}" "$SHA"

      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            live="$(curl --silent --fail --max-time 15 https://www.trilleo.net/version.txt || true)"
            if [ "$live" = "$SHA" ]; then
              echo "Live: $SHA"
              exit 0
            fi
            echo "Attempt $attempt: version.txt shows '${live}'"
            sleep 10
          done
          echo "::error::https://www.trilleo.net/version.txt doesn't show $SHA"
          exit 1
