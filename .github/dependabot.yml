version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint and @astrojs/check don't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Dockerfile base images (pinned by digest). Each update means a slow first upload
  # to SWR in China, so check monthly. Postgres is pinned in deploy/compose.yaml,
  # which Dependabot can't read; update that tag by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Node stays on the LTS line in .nvmrc (24); moving to a new major is a
      # deliberate change there, in package.json#engines, and here together.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
